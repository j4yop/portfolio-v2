<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="ycMossBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#24140c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="24" fill="url(#ycMossBg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Orange atmospheric glow -->
  <circle cx="260" cy="98" r="70" fill="#ff6600" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="340" cy="98" r="70" fill="#06b6d4" fill-opacity="0.14" filter="url(#glow)"/>

  <!-- Y Combinator Orange Box Logo -->
  <rect x="228" y="68" width="60" height="60" rx="14" fill="#ff6600"/>
  <text x="258" y="112" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900">Y</text>

  <!-- Times separator -->
  <text x="300" y="107" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">×</text>

  <!-- Moss Zero-Latency Speed Emblem -->
  <rect x="312" y="68" width="60" height="60" rx="14" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <path d="M345 76 L329 100 L343 100 L337 120 L355 94 L341 94 Z" fill="#38bdf8"/>

  <!-- Winner Badge Pill -->
  <rect x="205" y="146" width="190" height="28" rx="14" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="165" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">★ 1ST PLACE WINNER ★</text>

  <!-- Text Hierarchy -->
  <text x="300" y="240" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">YC Fall 2026 × Moss</text>
  <text x="300" y="278" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Zero-Latency Builder Sprint</text>
  <text x="300" y="314" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Best Use of Moss • Pulse911 Dispatch</text>
</svg>
