<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="hdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#12102e"/>
      <stop offset="100%" stop-color="#1e1848"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="24" fill="url(#hdBg)"/>

  <!-- Tech grid pattern -->
  <g opacity="0.08" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Purple atmospheric glow -->
  <circle cx="300" cy="100" r="80" fill="#8b5cf6" fill-opacity="0.22" filter="url(#purpleGlow)"/>

  <!-- Hackathon Emblem Card -->
  <rect x="264" y="66" width="72" height="72" rx="18" fill="#17123d" stroke="#a78bfa" stroke-width="2"/>
  <text x="300" y="112" text-anchor="middle" fill="#c4b5fd" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>

  <!-- Winner Badge Pill -->
  <rect x="195" y="150" width="210" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="300" y="169" text-anchor="middle" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">★ TOP 50 GLOBAL FINALIST ★</text>

  <!-- Text Hierarchy -->
  <text x="300" y="242" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">Hack Devengers 2.0</text>
  <text x="300" y="280" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Global Finalist • 1,500+ Submissions</text>
  <text x="300" y="316" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">contextgc AST Defragmenter (PyPI)</text>
</svg>
